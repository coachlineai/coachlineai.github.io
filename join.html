<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start coaching | Coachline</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f6fa;color:#211e2e;font:1rem/1.5 system-ui,sans-serif}main{max-width:32rem;margin:6vh auto;background:white;border:1px solid #dedbe7;border-radius:24px;padding:clamp(24px,5vw,44px)}strong{color:#5846b7}h1{line-height:1.1;font-size:2.3rem}label{display:block;margin:18px 0}input[type=tel]{width:100%;margin-top:6px;border:1px solid #aaa4b9;border-radius:12px;padding:13px;font:inherit}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}button,.cta{display:block;border:0;border-radius:28px;background:#282137;padding:14px 22px;color:white;font:inherit;text-align:center;text-decoration:none;width:100%;cursor:pointer}button:disabled{opacity:.6}a{color:#5444a0}[hidden]{display:none}</style></head>
<body><main><strong>✦ Coachline</strong><h1 id="heading">Start coaching</h1><p>Use the mobile number you’ll text your coach from. We’ll use it to connect your messages to your coaching profile.</p>
<form id="signup"><label>Mobile number<input id="mobile" type="tel" autocomplete="tel" placeholder="+1 (555) 555-0123" required></label>
<label><input id="age" type="checkbox" required> I’m at least 13 years old.</label>
<label><input id="agree" type="checkbox" required> I agree to let Coachline and its messaging provider use my number for verification, including a private support record, and receive coaching texts. I can text STOP anytime.</label>
<button id="submit">Set up messaging</button></form><p id="status" role="status"></p><a class="cta" id="message" hidden>Open Messages</a></main><script type="module" src="./join.js"></script></body></html>
