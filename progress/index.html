<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>My progress | Coachline</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../dashboard.css"><link rel="stylesheet" href="progress.css">
<aside id="sidebar"><div class="brand"><i>✦</i>Coachline</div><nav aria-label="Client dashboard"><button data-tab="Today" aria-current="page">Today</button><button data-tab="Calendar">Calendar</button><button data-tab="Progress">Progress</button></nav><footer><a id="message" hidden>Message my coach ↗</a></footer></aside>
<header><button id="menu" aria-controls="sidebar" aria-expanded="false">☰ Menu</button><b id="section">Today</b><span>Client dashboard</span></header>
<main><p id="status" role="status">Opening your dashboard…</p><div id="view"></div></main>
<dialog id="meal"><form><h2>Log a meal</h2><label>Meal<input name="meal" maxlength="120" required placeholder="e.g. Chicken and rice"></label><label>Date<input name="day" type="date" required></label><label>Calories (kcal)<input name="calories" type="number" min="0" max="20000" required></label><div class="grams"><label>Protein (g)<input name="protein" type="number" min="0" max="2000" step="0.1" required></label><label>Carbs (g)<input name="carbs" type="number" min="0" max="2000" step="0.1" required></label><label>Fat (g)<input name="fat" type="number" min="0" max="2000" step="0.1" required></label></div><p role="status"></p><button class="soft" type="button" id="cancel">Cancel</button> <button class="primary">Save meal</button></form></dialog>
<script type="module" src="progress.js"></script></html>
