.hint{font-size:14px;color:#a8a8a8;margin:14px 0 0}.number{display:inline-block;font-size:14px;color:#d8d8d8;margin-top:5px}.number:hover{text-decoration:underline}
footer{text-align:center;padding:38px 20px 28px;font-size:13px;color:#888}footer a{font-size:18px;letter-spacing:-.7px;font-weight:700;color:white;margin-left:5px}footer a span{color:#fff500}
@media(max-width:600px){body{padding:0;background:#050505}body::before,body::after{display:none}.profile{width:100%;min-height:100svh;border-radius:0;box-shadow:none}.portrait{height:clamp(390px,110vw,520px)}.identity{margin-top:-90px;padding:0 20px}h1{font-size:clamp(27px,7.2vw,32px)}.contact{padding:26px 24px 0}footer{padding-bottom:max(28px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.message,.socials a{transition:none}.message:hover,.message:focus-visible,.socials a:hover{transform:none}}
